[project]
name = "flopo2"
version = "0.1.0"
description = "FLOPO 2.0 — LLM/Graph-RAG rebuild of the Flora Phenotype Ontology: ontology-grounded trait extraction, curated trait database, OWL release, and trait website."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Robert Hoehndorf" }]

# Dependencies are grouped by pipeline stage. Heavy/optional engines live in extras so the
# core (ingestion + registry + DB) installs without LLM/ontology toolchains.
dependencies = [
    "lxml>=5.0",          # FlorML XML parsing
    "rdflib>=7.0",        # OWL/RDF parsing (IRI registry, PROV export)
    "psycopg[binary]>=3.1",  # Postgres
    "pydantic>=2.0",      # schema-validated assertion records
    "httpx>=0.27",        # OpenRouter / GNparser / WFO / IPNI APIs
    "pyyaml>=6.0",
    "tenacity>=8.0",      # retry/backoff for API calls
]

[project.optional-dependencies]
extract = [
    "ontogpt>=1.0",       # SPIRES engine (engine B)
    "oaklib>=0.6",        # OAK grounding to PO/PATO/TO/UO
    "linkml>=1.7",        # LinkML schema → validation + DDL
]
nlp = [
    "spacy>=3.7",         # dependency parse cross-check (EN)
    "stanza>=1.8",        # dependency parse (FR)
]
graphrag = [
    "networkx>=3.0",      # ontology KG
    "chromadb>=0.5",      # vector store for retrieval (engine A)
]
terminology = [
    "sentence-transformers>=3.0",  # optional SapBERT dense candidate retrieval
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
flopo-terminology = "flopo2.terminology.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flopo2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# LinkML-generated artifacts are not hand-maintained.
extend-exclude = ["*_models.py"]
