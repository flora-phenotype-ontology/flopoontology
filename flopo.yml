# PURL configuration for http://purl.obolibrary.org/obo/flopo
# Mirrors OBOFoundry/purl.obolibrary.org config/flopo.yml.

idspace: FLOPO
base_url: /obo/flopo

products:
- flopo.owl: https://github.com/flora-phenotype-ontology/flopoontology/raw/master/ontology/flopo.owl

term_browser: custom

entries:
- exact: /flopo-light.owl
  replacement: https://github.com/flora-phenotype-ontology/flopoontology/raw/master/ontology/flopo-light.owl

- prefix: /releases/
  replacement: https://github.com/flora-phenotype-ontology/flopoontology/releases/download/v
  tests:
  - from: /releases/2026-07-15/flopo.owl
    to: https://github.com/flora-phenotype-ontology/flopoontology/releases/download/v2026-07-15/flopo.owl
  - from: /releases/2026-07-31/flopo.owl
    to: https://github.com/flora-phenotype-ontology/flopoontology/releases/download/v2026-07-31/flopo.owl
  - from: /releases/2026-10-05/flopo.owl
    to: https://github.com/flora-phenotype-ontology/flopoontology/releases/download/v2026-10-05/flopo.owl
  - from: /releases/2026-10-05/flopo-light.owl
    to: https://github.com/flora-phenotype-ontology/flopoontology/releases/download/v2026-10-05/flopo-light.owl
