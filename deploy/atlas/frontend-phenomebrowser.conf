# Add to the phenomebrowser.net server block on `frontend` (10.254.146.242) and `frontend1`
# (10.254.147.211), /etc/nginx/sites-available/phenomebrowser.net, then `nginx -t && nginx -s reload`.
# The atlas runs on ws (10.73.11.158): nginx on :8778 in front of QLever (tools/deploy_atlas.sh).

location = /flopo {
    return 301 /flopo/;
}

location /flopo/ {
    proxy_pass http://10.73.11.158:8778/;           # strips the /flopo prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /flopo;      # ws builds browser redirects under /flopo/
    proxy_read_timeout 90s;
    client_max_body_size 64k;
}
