# Saudi Flora Trait Atlas on ws (nginx container, host network).
#
#   :8778            live; phenomebrowser.net/flopo/ proxies here (frontend strips the /flopo prefix
#                    and sends X-Forwarded-Prefix: /flopo)
#   127.0.0.1:8779   staging; the release being deployed, checked before the switch
#
# tools/deploy_atlas.sh writes /srv/atlas/state/{live,staging}.conf, which set the release's web
# root and its QLever container, and reloads nginx.

map $http_x_forwarded_for $atlas_client {
    ""                     $remote_addr;
    "~^(?<first>[^,\s]+)"  $first;
}
limit_req_zone $atlas_client zone=atlas_sparql:10m rate=10r/s;

# Browser downloads cannot set Accept, so ?format= chooses the result format.
map $arg_format $atlas_sparql_accept {
    csv      "text/csv";
    tsv      "text/tab-separated-values";
    json     "application/sparql-results+json";
    xml      "application/sparql-results+xml";
    default  $http_accept;
}

# Data IRIs: RDF for clients that ask for it, the browser for everyone else.
map $http_accept $atlas_rdf_type {
    default                       "";
    "~*application/n-triples"     "application/n-triples";
    "~*text/turtle"               "text/turtle";
    "~*application/rdf\+xml"      "text/turtle";
    "~*application/ld\+json"      "text/turtle";
}

server {
    listen 8778;
    server_name _;
    include /srv/atlas/state/live.conf;
    include /etc/nginx/conf.d/atlas-common.inc;
}

server {
    listen 127.0.0.1:8779;
    server_name _;
    include /srv/atlas/state/staging.conf;
    include /etc/nginx/conf.d/atlas-common.inc;
}
