transformers = "==4.57.1"
open-clip-torch = "==3.2.0"
huggingface-hub = "==0.35.3"
numpy = "==2.2.6"
pillow = "==11.3.0"
rdflib = "==7.1.4"
pytest = "==8.4.2"
